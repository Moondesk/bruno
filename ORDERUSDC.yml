info:
  name: ORDERUSDC
  type: http
  seq: 5

http:
  method: GET
  url: https://api.coingecko.com/api/v3/simple/price?ids={{ticker}}&vs_currencies=usd
  params:
    - name: ids
      value: "{{ticker}}"
      type: query
    - name: vs_currencies
      value: usd
      type: query
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("ticker","orderly-network");
    - type: tests
      code: |-
        const json = res.body["orderly-network"]
        const price = res.body["orderly-network"].usd;

        test("Status 200", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response is JSON", function() {
        expect(res.getHeader("content-type")).to.contain("application/json");
        });

        test("Response time is under 3s",function() {
            expect(res.getResponseTime()).to.be.below(3000);
            });

        test("Ticker exists", () => {
          expect(json.symbol).to.exist;
        });

        test("Price is a valid positive number", () => {
        expect(typeof price).to.equal("number");
        expect(price > 0).to.equal(true);
        });

        test("Currency exists", () => {
          expect(json.symbol).to.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
